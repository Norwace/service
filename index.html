<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Anleggsservice</title>
<style>
:root{
  --bg:#16181D; --surface:#1F232B; --surface2:#272C36; --line:#2E3440;
  --text:#E9ECF1; --muted:#97A0AD;
  --amber:#E8A33D; --green:#46B873; --red:#E0584F; --blue:#5B8DEF; --purple:#BFA4F0;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.wrap{max-width:640px; margin:0 auto; padding:14px 14px 24px}
.verbar{position:absolute; top:0; left:0; right:0; max-width:640px; margin:0 auto;
  display:flex; justify-content:flex-end; padding:calc(7px + env(safe-area-inset-top)) 14px 0;
  pointer-events:none; z-index:15}
.ver{font-size:11px; font-weight:700; color:var(--muted); background:var(--surface);
  border:1px solid var(--line); border-radius:99px; padding:2px 8px}
#splash{position:fixed; inset:0; z-index:50; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  padding-bottom:env(safe-area-inset-bottom); transition:opacity .4s ease}
#splash img{width:62%; max-width:300px; height:auto}
#splash.hide{opacity:0; pointer-events:none}
h1{font-size:20px; font-weight:800; letter-spacing:.3px; margin:6px 0 14px}
h2{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:22px 0 8px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.sigcanvas{width:100%; height:120px; background:#fff; border:1px solid var(--line);
  border-radius:10px; display:block; touch-action:none}
.sigimg{width:100%; max-height:90px; object-fit:contain; background:#fff;
  border:1px solid var(--line); border-radius:10px; padding:4px}
.sigrow{display:flex; gap:8px; margin-top:6px}
.sigrow .btn-sm{flex:0 0 auto}
.ikpoint{border-top:1px solid var(--line); padding-top:10px; margin-top:10px}
.ikpoint:first-child{border-top:none; margin-top:0; padding-top:0}

/* fullskjerm kundesignatur – hele skjermen er skrivefelt, telefon holdes liggende (topp mot venstre) */
#signpad{position:fixed; inset:0; z-index:9999; background:#fff}
#signcanvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
#signpad .sp-btn{position:absolute; width:112px; height:46px; margin:0; padding:0;
  transform:rotate(90deg); border-radius:10px; font-size:15px; z-index:2}
#signpad #sp_done{right:-25px; bottom:44px}
#signpad #sp_clear{left:-25px; bottom:44px}
#signpad #sp_cancel{left:-25px; top:44px}

/* ---------- cards / dashboard ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:14px; margin-bottom:10px; cursor:pointer}
.card:active{background:var(--surface2)}
.cardtop{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.cname{font-weight:700; font-size:17px; margin-bottom:5px}
.caddr{color:var(--muted); font-size:13px; margin-top:2px}
.cdiv{height:1px; background:var(--line); margin:7px 0 5px; opacity:.8}
.cmeta{margin-top:7px}
.cgroup{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--text); margin-bottom:3px}
.c-rens{color:var(--purple)}
.c-svc{color:var(--amber)}
.pill{font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; flex-shrink:0}
.p-ok{background:rgba(70,184,115,.15); color:var(--green)}
.p-warn{background:rgba(232,163,61,.15); color:var(--amber)}
.p-over{background:rgba(224,88,79,.18); color:var(--red)}
.p-none{background:rgba(151,160,173,.15); color:var(--muted)}
.p-call{background:rgba(91,141,239,.15); color:var(--blue)}
.rensbadge{display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:99px;
  background:rgba(191,164,240,.16); color:var(--purple); margin-left:6px; vertical-align:middle}
.checkrow{display:flex; align-items:center; gap:12px; margin-top:14px; padding:13px 14px;
  background:var(--surface2); border:1px solid var(--line); border-radius:10px; cursor:pointer; user-select:none}
.checkrow input{width:22px; height:22px; margin:0; flex-shrink:0; accent-color:var(--green)}
.checkrow span{font-size:15px; font-weight:600}
.taskgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px}
.taskgrid .checkrow{margin-top:0; padding:11px 12px}
.taskgrid .checkrow span{font-size:14px}
.gauge{height:6px; background:var(--surface2); border-radius:99px; margin-top:11px; overflow:hidden}
.gauge>div{height:100%; border-radius:99px; transition:width .3s}
.g-ok{background:var(--green)} .g-warn{background:var(--amber)} .g-over{background:var(--red)} .g-none{background:var(--line)}

input,textarea,select{
  width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit; margin-top:5px}
textarea{min-height:84px; resize:vertical}
label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin-top:13px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--amber); outline-offset:1px}

button{font-family:inherit; cursor:pointer; border:none; border-radius:11px; font-size:15px; font-weight:700}
.btn{background:var(--amber); color:#1A1408; padding:13px 16px; width:100%; margin-top:16px}
.btn2{background:var(--surface2); color:var(--text); border:1px solid var(--line); padding:13px 16px; width:100%; margin-top:10px}
.btn-danger{background:transparent; color:var(--red); border:1px solid rgba(224,88,79,.4); padding:12px 16px; width:100%; margin-top:10px}
.btn-sm{background:var(--surface2); color:var(--text); border:1px solid var(--line); padding:7px 12px; font-size:13px}

.search{margin-bottom:12px}
.clockTop{font-size:26px; font-weight:600; letter-spacing:.2px; margin:0 0 2px; white-space:nowrap}
.clockDate{font-size:14px; font-weight:600; color:var(--muted); margin:0}
.csec{font-size:16px; font-weight:600; color:var(--muted)}
.dashhead{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin:6px 0 14px}
.brand{display:flex; align-items:center; flex-shrink:0}
.brand img{height:48px; width:auto; display:block}
.clockver{font-size:11px; font-weight:700; color:var(--muted); margin-top:5px}
.fab{position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; background:var(--amber); color:#1A1408;
  font-size:30px; line-height:0; box-shadow:0 4px 14px rgba(0,0,0,.45); z-index:5}
.empty{color:var(--muted); text-align:center; padding:42px 20px; line-height:1.5}
.memocard{display:flex; align-items:flex-start; gap:10px}
.grip{flex-shrink:0; width:30px; display:flex; align-items:center; justify-content:center;
  color:var(--muted); cursor:grab; touch-action:none; align-self:stretch; margin:-14px 0 -14px -4px; padding:0 2px}
.grip svg{width:20px; height:20px}
.memobody{flex:1; min-width:0}
.card.dragging{opacity:.85; border-color:var(--amber); box-shadow:0 6px 18px rgba(0,0,0,.5)}
.banner{background:rgba(232,163,61,.12); border:1px solid rgba(232,163,61,.35); color:var(--amber);
  border-radius:11px; padding:10px 13px; font-size:13.5px; margin-bottom:12px}

/* ---------- detail ---------- */
.topbar{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.back{background:none; color:var(--amber); font-size:15px; padding:8px 8px 8px 0}
.row{display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--line); font-size:15px}
.row:last-child{border-bottom:none}
.rlabel{color:var(--muted); font-size:13px; flex-shrink:0}
.rval{text-align:right; word-break:break-word}
a.link{color:var(--amber); text-decoration:none; font-weight:600}
.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:4px 14px}
.notebox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:13px 14px; font-size:15px; white-space:pre-wrap; word-break:break-word; line-height:1.45}
.hist{padding:11px 0; border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:none}
.hdate{font-weight:700; font-size:14px}
.hnote{color:var(--muted); font-size:14px; margin-top:3px; white-space:pre-wrap}
.hrow{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.del{background:none; color:var(--muted); font-size:18px; padding:0 4px; line-height:1}

/* ---------- calendar ---------- */
.calhead{display:flex; justify-content:space-between; align-items:center; margin:4px 0 10px}
.calhead b{font-size:17px; text-transform:capitalize}
.navbtn{background:var(--surface2); border:1px solid var(--line); color:var(--text);
  width:40px; height:40px; border-radius:10px; font-size:18px}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.dow{text-align:center; font-size:11px; color:var(--muted); font-weight:700; padding:4px 0}
.day{aspect-ratio:1; border-radius:9px; background:var(--surface); border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:14px; cursor:pointer; position:relative}
.day.out{opacity:.32}
.day.today{border-color:var(--amber)}
.day.sel{background:var(--amber); color:#1A1408; font-weight:800; border-color:var(--amber)}
.dots{display:flex; gap:3px; height:5px}
.dot{width:5px; height:5px; border-radius:50%}
.d-appt{background:var(--blue)} .d-due{background:var(--amber)} .d-over{background:var(--red)}
.day.sel .dot{background:#1A1408}
.agitem{display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
.agitem:last-child{border-bottom:none}
.agdot{width:9px; height:9px; border-radius:50%; margin-top:6px; flex-shrink:0}
.agbody{flex:1}
.agtitle{font-weight:700; font-size:15px}
.agsub{color:var(--muted); font-size:13px; margin-top:2px}

/* ---------- bottom nav ---------- */
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface);
  border-top:1px solid var(--line); display:flex; z-index:10;
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1; background:none; color:var(--muted); padding:11px 0 9px; font-size:12px;
  font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px; border-radius:0}
.nav button.on{color:var(--amber)}
.nav svg{width:22px; height:22px}

/* ---------- modal sheet ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:flex-end}
.sheet{background:var(--surface); width:100%; max-width:640px; margin:0 auto;
  border-radius:18px 18px 0 0; padding:18px 16px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto}
.sheet h3{margin:0 0 4px; font-size:18px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(82px + env(safe-area-inset-bottom));
  background:var(--surface2); border:1px solid var(--line); color:var(--text);
  padding:10px 18px; border-radius:99px; font-size:14px; font-weight:600; z-index:30;
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(30px); opacity:.6} to{transform:none; opacity:1}}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
</head>

};

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromIso(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmt(s){ if(!s) return ""; const [y,m,d] = s.split("-"); return d+"."+m+"."+y; }
function fmtShort(s){ if(!s) return ""; const [y,m,d] = s.split("-"); return d+"."+m; }
const MND = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const DAGER = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];
function ukedagKort(s){ return DAGER[fromIso(s).getDay()].slice(0,3)+"."; }
let _lastSec = -1;
function updateClock(){
  const top = $("clockTop"); if(!top) return;
  const d = new Date();
  _lastSec = d.getSeconds();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  const ss = String(d.getSeconds()).padStart(2,"0");
  top.innerHTML = DAGER[d.getDay()] + " · " + hh + ":" + mm + '<span class="csec">:' + ss + '</span>';
  const dt = $("clockDate");
  if(dt) dt.textContent = d.getDate() + ". " + MND[d.getMonth()] + " " + d.getFullYear();
}
function tickClock(){
  const top = $("clockTop"); if(!top) return;
  if(new Date().getSeconds() !== _lastSec) updateClock();
}

function lastRensDate(c){
  if(!c.history) return null;
  const r = c.history.filter(e=>e.rens).map(e=>e.date).sort();
  return r.length ? r[r.length-1] : null;
}
function lastServiceOnlyDate(c){
  if(!c.history) return null;
  const r = c.history.filter(e=>!e.rens).map(e=>e.date).sort();
  return r.length ? r[r.length-1] : null;
}
function rensOn(c){ return c.rensEnabled !== undefined ? !!c.rensEnabled : (c.intervalWeeks>0); }
function status(c){
  const today = today0();
  // Planlagt rens overstyrer nedtellingen – tell ned til den planlagte datoen
  const plan = DB.appointments
    .filter(a => a.companyId === c.id && a.rens && a.date >= iso(today))
    .map(a => a.date).sort();
  if(plan.length){
    const nextIso = plan[0];
    const next = fromIso(nextIso);
    const days = Math.round((next - today) / 86400000);
    const lastRens = lastRensDate(c);
    let total = lastRens ? Math.round((next - fromIso(lastRens)) / 86400000)
                         : (c.intervalWeeks > 0 ? c.intervalWeeks*7 : days);
    total = Math.max(total, 1);
    const pct = Math.max(2, Math.min(100, ((total-days)/total)*100));
    if(days === 0) return { key:"over", label:"Forfaller i dag", days, pct:100, sort:0, next:nextIso, planned:true };
    if(days <= 7) return { key:"warn", label:"Om "+days+(days===1?" dag":" dager"), days, pct, sort:days, next:nextIso, planned:true };
    return { key:"ok", label:"Om "+days+" dager", days, pct, sort:days, next:nextIso, planned:true };
  }
  // Ingen fast rens → ingen nedtelling, ingen pill
  if(!rensOn(c) || !c.intervalWeeks || c.intervalWeeks <= 0){
    return { key:"none", label:"", days:0, pct:0, sort:9e9 };
  }
  const lastRens = lastRensDate(c);
  if(!lastRens) return { key:"none", label:"", days:0, pct:0, sort:-0.5 };
  const next = fromIso(lastRens); next.setDate(next.getDate() + c.intervalWeeks*7);
  const days = Math.round((next - today0()) / 86400000);
  const total = c.intervalWeeks*7;
  const pct = Math.max(2, Math.min(100, ((total-days)/total)*100));
  if(days < 0)  return { key:"over", label: -days + (days===-1?" dag":" dager") + " over fristen", days, pct:100, sort:days, next:iso(next) };
  if(days === 0) return { key:"over", label:"Forfaller i dag", days, pct:100, sort:0, next:iso(next) };
  if(days <= 7) return { key:"warn", label:"Om "+days+(days===1?" dag":" dager"), days, pct, sort:days, next:iso(next) };
  return { key:"ok", label:"Om "+days+" dager", days, pct, sort:days, next:iso(next) };
}
function toast(msg){
  $("toastbox").innerHTML = '<div class="toast">'+esc(msg)+'</div>';
  setTimeout(()=>{ $("toastbox").innerHTML=""; }, 2200);
}

function go(v){ searchQ = ""; history.pushState({v:v, d:null}, ""); setView(v); }
function openDetail(id){ history.pushState({v:"detail", d:id}, ""); setView("detail", id); }
function openMemo(id){ history.pushState({v:"memo", d:id}, ""); setView("memo", id); }
function setView(v, d){ view = v; detailId = d || null; render(); window.scrollTo(0,0); }
window.addEventListener("popstate", e => {
  const sp = document.getElementById("signpad");
  if(sp){ sp.remove(); history.pushState({modal:1, v:view, d:detailId}, ""); return; }
  if($("modal").innerHTML){ $("modal").innerHTML = ""; return; }

});

function render(){
  const vb = document.querySelector(".verbar");
  if(vb) vb.style.display = (view==="dash") ? "none" : "flex";
  renderNav();
  if(view==="dash") renderDash();

  else renderBackup();
}

function renderDash(){
  let h = '<div class="dashhead">'+
    '<div><div class="clockTop" id="clockTop"></div><div class="clockDate" id="clockDate"></div>'+
    '<div class="clockver">'+esc(APP_VERSION)+'</div></div>'+

  '</div>';
  if(DB.companies.length >= 3){
    const last = DB.lastExport ? (today0() - fromIso(DB.lastExport.slice(0,10)))/86400000 : 999;
    if(last > 30) h += '<div class="banner">Over 30 dager siden forrige backup. Ta en eksport under Backup-fanen.</div>';
  }
  h += '<div id="dashlist"></div>';
  h += '<button class="btn" onclick="openCompanyForm()">+ Legg til bedrift</button>';
  $("app").innerHTML = h;
  updateClock();
  renderDashList();
}
function renderDashList(){
  const q = searchQ.trim().toLowerCase();
  let list = DB.companies.filter(c => !q || c.name.toLowerCase().includes(q) || (c.address||"").toLowerCase().includes(q));
  list = list.map(c => ({c, s:status(c)})).sort((a,b) => a.s.sort - b.s.sort);
  if(!DB.companies.length){
    $("dashlist").innerHTML = '<div class="empty">Ingen bedrifter enda.<br>Trykk + for å legge til den første.</div>';
    return;
  }
  if(!list.length){ $("dashlist").innerHTML = '<div class="empty">Ingen treff.</div>'; return; }
  const todayIso = iso(today0());
  $("dashlist").innerHTML = list.map(({c,s}) => {
    const rensDate = lastRensDate(c);
    const svcDate = lastServiceOnlyDate(c);
    let histLines = "";
    if(rensDate) histLines += '<div class="caddr"><span class="c-rens">Renset:</span> ' + ukedagKort(rensDate) + ' ' + fmt(rensDate) + '</div>';
    if(svcDate)  histLines += '<div class="caddr"><span class="c-svc">Service:</span> ' + ukedagKort(svcDate) + ' ' + fmt(svcDate) + '</div>';
    const upcoming = DB.appointments
      .filter(a => a.companyId === c.id && a.date >= todayIso)
      .sort((a,b) => a.date.localeCompare(b.date) || (a.time||"").localeCompare(b.time||""));
    const nextRens = upcoming.find(a => a.rens);
    const nextSvc  = upcoming.find(a => !a.rens);
    let planLines = "";
    if(nextRens){ const t = nextRens.time ? ' · '+esc(nextRens.time) : '';
      planLines += '<div class="caddr"><span class="c-rens">Rens:</span> ' + ukedagKort(nextRens.date) + ' ' + fmtShort(nextRens.date) + t + '</div>'; }
    if(nextSvc){ const t = nextSvc.time ? ' · '+esc(nextSvc.time) : '';
      planLines += '<div class="caddr"><span class="c-svc">' + esc(nextSvc.title||"Service") + ':</span> ' + ukedagKort(nextSvc.date) + ' ' + fmtShort(nextSvc.date) + t + '</div>'; }
    const planBlock = planLines ? '<div class="cgroup">Planlagt</div>' + planLines : "";
    const histBlock = histLines ? '<div class="cgroup">Sist utført</div>' + histLines : "";
    const divider = (planBlock && histBlock) ? '<div class="cdiv"></div>' : "";
    const lines = planBlock + divider + histBlock;
    const plabel = s.label ? 'Rens ' + s.label.charAt(0).toLowerCase() + s.label.slice(1) : "";
    const pill = (s.key !== "none") ? '<span class="pill p-'+s.key+'">'+plabel+'</span>' : "";
    const gauge = (s.key !== "none") ? '<div class="gauge"><div class="g-'+s.key+'" style="width:'+s.pct+'%"></div></div>' : "";
    return '<div class="card" onclick="openDetail(\''+c.id+'\')">'+
      '<div class="cardtop"><div><div class="cname">'+esc(c.name)+'</div>'+(lines?'<div class="cmeta">'+lines+'</div>':"")+'</div>'+
      pill+'</div>'+ gauge +
    '</div>';
  }).join("");
}

/* ================= IKEA-skjema ================= */
let _custSigData = null;   // midlertidig kundesignatur mens skjemaet er åpent

function openSignPad(){
  const ov = document.createElement("div");
  ov.id = "signpad";
  ov.innerHTML =
    '<canvas id="signcanvas"></canvas>'+
    '<button id="sp_cancel" class="btn2 sp-btn" onclick="closeSignPad()">Avbryt</button>'+
    '<button id="sp_clear" class="btn2 sp-btn" onclick="clearSignPad()">Tøm</button>'+
    '<button id="sp_done" class="btn sp-btn" onclick="doneSignPad()">Ferdig</button>';
  document.body.appendChild(ov);

  const cv = document.getElementById("signcanvas");
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = w * dpr;
  cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "#14203a"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.lineJoin = "round";
  cv._ctx = ctx; cv._w = w; cv._h = h; cv._drawn = false;

  let draw = false;
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId);
    draw = true; cv._drawn = true; ctx.beginPath(); ctx.moveTo(e.clientX,e.clientY); ctx.lineTo(e.clientX+0.1,e.clientY+0.1); ctx.stroke(); };
  cv.onpointermove = e => { if(!draw) return; e.preventDefault(); ctx.lineTo(e.clientX,e.clientY); ctx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { draw = false; };
}
function clearSignPad(){
  const cv = document.getElementById("signcanvas");
  if(!cv) return;
  cv._ctx.fillStyle = "#fff"; cv._ctx.fillRect(0,0,cv._w,cv._h);
  cv._drawn = false;
}
function closeSignPad(){
  const ov = document.getElementById("signpad");
  if(ov) ov.remove();
}
function doneSignPad(){
  const cv = document.getElementById("signcanvas");
  if(!cv._drawn){ toast("Ingen signatur tegnet"); return; }
  // roter 90° (telefon holdt liggende, topp mot venstre) og skaler til 600x180
  const out = document.createElement("canvas");
  out.width = 600; out.height = 180;
  const octx = out.getContext("2d");
  octx.fillStyle = "#fff"; octx.fillRect(0,0,600,180);
  octx.setTransform(0, -180/cv.width, 600/cv.height, 0, 0, 180);
  octx.drawImage(cv, 0, 0);
  octx.setTransform(1,0,0,1,0,0);
  _custSigData = out.toDataURL("image/png");
  const prev = document.getElementById("cust_preview");
  if(prev) prev.innerHTML = '<img class="sigimg" src="'+_custSigData+'">';
  closeSignPad();
  toast("Kundesignatur lagret");
}

function openIkeaForm(cid, formId){
  _custSigData = null;
  history.pushState({modal:1, v:view, d:detailId}, "");
  const c = DB.companies.find(x=>x.id===cid);
  const f = formId ? (c.forms||[]).find(x=>x.id===formId) : null;
  const now = new Date();
  const defMY = MND[now.getMonth()].charAt(0).toUpperCase()+MND[now.getMonth()].slice(1)+" "+now.getFullYear();
  const pts = IKEA_POINTS.map((p,i) => {
    const pd = f && f.points && f.points[i] ? f.points[i] : {ok:false, avvik:""};
    return '<div class="ikpoint">'+
      '<label class="checkrow"><input type="checkbox" id="ik_ok'+i+'"'+(pd.ok?" checked":"")+'><span><b>'+p+'</b> – i orden</span></label>'+
      '<input id="ik_av'+i+'" placeholder="Avvik / kommentar (valgfritt)" value="'+esc(pd.avvik||"")+'" style="margin-top:6px">'+
      '</div>';
  }).join("");
  const mySigBlock = '<img class="sigimg" src="'+MY_SIG_SRC+'">';
  const custBlock =
    '<div id="cust_preview">'+
    (f && f.custSig ? '<img class="sigimg" src="'+f.custSig+'">' : '')+
    '</div>'+
    '<button class="btn2" onclick="openSignPad()">'+
      (f && f.custSig ? 'Kunde signerer på nytt' : 'Kunde signerer her')+
    '</button>';
  $("modal").innerHTML =
  '<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="sheet">'+
  '<h3>IKEA Kvartalsvis Servicegjennomgang</h3>'+
  '<label>Varehus</label><input id="ik_hus" value="'+esc(f?f.varehus:c.name)+'">'+
  '<label>Måned og år</label><input id="ik_my" value="'+esc(f?f.monthYear:defMY)+'">'+
  '<label>Dato</label><input id="ik_date" type="date" value="'+(f?f.date:iso(today0()))+'">'+
  '<label style="margin-top:14px">Sjekkpunkter</label><div class="box" style="padding:12px">'+pts+'</div>'+
  '<label>Ytterligere notater (valgfritt)</label><textarea id="ik_extra" placeholder="Vises i PDF-en kun hvis utfylt…">'+esc(f&&f.extra?f.extra:"")+'</textarea>'+
  '<label>Min signatur</label>'+mySigBlock+
  '<label>Signatur kunde</label>'+custBlock+
  '<button class="btn" onclick="saveIkea(\''+cid+'\','+(formId?'\''+formId+'\'':'null')+',\'share\')">Lagre og del PDF</button>'+
  '<button class="btn2" onclick="saveIkea(\''+cid+'\','+(formId?'\''+formId+'\'':'null')+',\'download\')">Lagre og last ned PDF</button>'+
  (f ? '<button class="btn-danger" onclick="delIkea(\''+cid+'\',\''+formId+'\')">Slett skjema</button>' : "")+
  '<button class="btn2" onclick="closeModal()">Avbryt</button>'+
  '</div></div>';
}
function saveIkea(cid, formId, mode){
  const c = DB.companies.find(x=>x.id===cid);
  const old = formId ? (c.forms||[]).find(x=>x.id===formId) : null;
  const date = $("ik_date").value;
  if(!date){ toast("Velg dato"); return; }
  const mySig = MY_SIG_SRC;
  const custSig = _custSigData || (old && old.custSig) || null;
  const points = IKEA_POINTS.map((p,i) => ({ ok:$("ik_ok"+i).checked, avvik:$("ik_av"+i).value.trim() }));
  const data = { date, varehus:$("ik_hus").value.trim(), monthYear:$("ik_my").value.trim(), points, extra:$("ik_extra").value.trim(), mySig, custSig };
  c.forms = c.forms || [];
  let f;
  if(old){ Object.assign(old, data); f = old; }
  else { f = Object.assign({id:uid()}, data); c.forms.push(f); }
  save(); closeModal(); render();
  toast(formId ? "Skjema oppdatert" : "Skjema lagret");
  ikeaPdf(c, f, mode);
}
function delIkea(cid, formId){
  if(!confirm("Slette dette skjemaet?")) return;
  const c = DB.companies.find(x=>x.id===cid);
  c.forms = (c.forms||[]).filter(x=>x.id!==formId);
  save(); closeModal(); render(); toast("Skjema slettet");
}
function ikeaPdf(c, f, mode){
  if(!window.jspdf || !window.jspdf.jsPDF){
    toast("PDF-modul ikke lastet – åpne appen med nett én gang"); return;
  }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  const W = 210, M = 15;
  let y = 12;
  // Barsystemer-logo (svart) øverst til høyre
  const lw = 52, lh = lw*532/1120;
  doc.addImage(PDF_LOGO_SRC, "PNG", W-M-lw, y, lw, lh);
  // Tittel til venstre
  doc.setFont("helvetica","bold"); doc.setFontSize(14);
  doc.text("IKEA Kvartalsvis", M, y+8);
  doc.text("Servicegjennomgang", M, y+15);
  y += lh + 12;
  doc.setFontSize(11);
  doc.setFont("helvetica","normal");
  doc.text("Varehus: ", M, y); doc.setFont("helvetica","bold");
  doc.text(f.varehus||"", M+20, y); y += 7;
  doc.setFont("helvetica","normal");
  doc.text("Måned og år: ", M, y); doc.setFont("helvetica","bold");
  doc.text(f.monthYear||"", M+27, y); y += 10;
  // Sjekkpunkter
  doc.setFontSize(10.5);
  IKEA_POINTS.forEach((p,i) => {
    const pd = f.points[i] || {ok:false, avvik:""};
    doc.setFont("helvetica","bold");
    doc.text(p+":", M, y);
    doc.setFont("helvetica","normal");
    if(pd.ok){ doc.setTextColor(20,120,60); doc.text("I orden", M+62, y); doc.setTextColor(0,0,0); }
    else if(pd.avvik){ doc.setTextColor(190,50,40); doc.text("Avvik", M+62, y); doc.setTextColor(0,0,0); }
    else { doc.text("–", M+62, y); }
    y += 5.5;
    if(pd.avvik){
      const lines = doc.splitTextToSize("Kommentar: "+pd.avvik, W-M*2-8);
      doc.setTextColor(70,70,70);
      doc.text(lines, M+6, y);
      doc.setTextColor(0,0,0);
      y += lines.length*4.6 + 1.5;
    }
    y += 2;
  });
  y += 4;
  if(f.extra){
    doc.setFont("helvetica","bold");
    doc.text("Ytterligere notater:", M, y); y += 6;
    doc.setFont("helvetica","normal");
    const el = doc.splitTextToSize(f.extra, W-M*2-4);
    doc.text(el, M+2, y);
    y += el.length*5 + 4;
  }
  doc.setFont("helvetica","bold");
  doc.text("Arbeid som skal utføres av Barsystemer AS:", M, y); y += 6;
  doc.setFont("helvetica","normal");
  IKEA_WORKS.forEach(w => {
    const lines = doc.splitTextToSize("• "+w, W-M*2-4);
    doc.text(lines, M+2, y);
    y += lines.length*5;
  });
  // Signaturer på streken (nytt ark hvis det ikke er plass)
  let lineY;
  if(y + 30 > 270){ doc.addPage(); lineY = 60; }
  else lineY = Math.max(y + 26, 262);
  const sw = 62;
  const myH = sw*168/644;                       // fast signatur (644x168)
  doc.addImage(MY_SIG_SRC, "PNG", M, lineY-myH+1.5, sw, myH);
  if(f.custSig){
    const ch = sw*180/600;                      // kundesignatur fra canvas (600x180)
    doc.addImage(f.custSig, "PNG", W-M-sw, lineY-ch+1.5, sw, ch);
  }
  doc.setDrawColor(80);
  doc.line(M, lineY, M+sw, lineY);
  doc.line(W-M-sw, lineY, W-M, lineY);
  doc.setFontSize(10);
  doc.text("Signatur Barsystemer AS", M, lineY+5);
  doc.text("Signatur kunde", W-M-sw, lineY+5);
  doc.text("Dato: "+fmt(f.date), M, lineY+13);
  const fname = "IKEA-skjema-"+(f.varehus||c.name).replace(/[^a-zA-Z0-9æøåÆØÅ ]/g,"").replace(/ +/g,"-")+"-"+f.date+".pdf";
  const blob = doc.output("blob");
  const file = new File([blob], fname, {type:"application/pdf"});
  if(mode==="share" && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:fname}).catch(()=>{});
  } else {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    if(mode==="share") toast("Deling ikke støttet – PDF lastet ned");
  }
}
function delCompany(id){
  const c = DB.companies.find(x=>x.id===id);
  if(!confirm('Slette "'+c.name+'" og all historikk? Dette kan ikke angres.')) return;
  DB.companies = DB.companies.filter(x=>x.id!==id);
  DB.appointments = DB.appointments.filter(a=>a.companyId!==id);
  save(); go("dash"); toast("Bedrift slettet");
}

/* ================= calendar ================= */
function dueMap(){
  // map of iso-date -> [{company, overdue}]
  const m = {};
  DB.companies.forEach(c => {
    const s = status(c);
    if(s.next){ (m[s.next] = m[s.next]||[]).push({c, over:s.days<=0}); }
  });
  return m;
}
function renderCal(){
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const due = dueMap();
  const apptDays = {};
  DB.appointments.forEach(a => { (apptDays[a.date] = apptDays[a.date]||[]).push(a); });

  let h = '<h1>Kalender</h1>'+
  '<div class="calhead"><button class="navbtn" onclick="calNav(-1)" aria-label="Forrige måned">‹</button>'+
  '<b>'+MND[mo]+' '+y+'</b>'+
  '<button class="navbtn" onclick="calNav(1)" aria-label="Neste måned">›</button></div>'+
  '<div class="calgrid">'+["M","T","O","T","F","L","S"].map(d=>'<div class="dow">'+d+'</div>').join("");

  const first = new Date(y, mo, 1);
  let startDow = (first.getDay()+6)%7; // mandag=0
  const gridStart = new Date(y, mo, 1-startDow);
  const todayIso = iso(today0());
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const di = iso(d);
    const out = d.getMonth()!==mo;
    let dots = "";
    if(apptDays[di]) dots += '<span class="dot d-appt"></span>';
    if(due[di]) dots += due[di].some(x=>x.over) ? '<span class="dot d-over"></span>' : '<span class="dot d-due"></span>';
    h += '<div class="day'+(out?" out":"")+(di===todayIso?" today":"")+(di===calSel?" sel":"")+'" onclick="calPick(\''+di+'\')">'+
         d.getDate()+'<span class="dots">'+dots+'</span></div>';
  }
  h += '</div>';

  // selected-day agenda
  const selAppts = (apptDays[calSel]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const selDue = due[calSel]||[];
  h += '<h2>'+fmt(calSel)+'</h2><div class="box">';
  if(!selAppts.length && !selDue.length) h += '<div class="row" style="color:var(--muted)">Ingenting denne dagen.</div>';
  selDue.forEach(({c,over}) => {
    h += '<div class="agitem"><span class="agdot" style="background:var(--'+(over?'red':'amber')+')"></span>'+
    '<div class="agbody" onclick="openDetail(\''+c.id+'\')" style="cursor:pointer"><div class="agtitle">Service forfaller: '+esc(c.name)+'</div>'+
    '<div class="agsub">Hver '+c.intervalWeeks+'. uke · trykk for å åpne</div></div></div>';
  });
  selAppts.forEach(a => {
    const comp = a.companyId ? DB.companies.find(x=>x.id===a.companyId) : null;
    const prefix = comp ? esc(comp.name)+" – " : "";
    const t = (a.title||"").toLowerCase();
    const tcol = t==="rens" ? "var(--purple)" : (t==="service" ? "var(--amber)" : "");
    const titleHtml = tcol ? '<span style="color:'+tcol+'">'+esc(a.title)+'</span>' : esc(a.title);
    const suffix = a.time ? " · "+esc(a.time) : "";
    const edit = a.companyId ? 'openPlanForm(\''+a.companyId+'\',\''+a.id+'\')' : 'openApptForm(\''+a.id+'\')';
    h += '<div class="agitem"><span class="agdot" style="background:var(--blue)"></span>'+
    '<div class="agbody" style="cursor:pointer" onclick="'+edit+'"><div class="agtitle">'+prefix+titleHtml+suffix+'</div>'+
    (a.note?'<div class="agsub">'+esc(a.note)+'</div>':"")+'</div></div>';
  });
  h += '</div><button class="btn" onclick="openApptForm()">+ Ny avtale '+fmt(calSel)+'</button>';
  $("app").innerHTML = h;
}
function calNav(dir){ calMonth.setMonth(calMonth.getMonth()+dir); renderCal(); }
function calPick(di){ calSel = di; renderCal(); }

function saveAppt(apptId){
  const title = $("a_title").value.trim();
  if(!title){ toast("Tittel må fylles inn"); return; }
  const date = $("a_date").value;
  if(!date){ toast("Velg dato"); return; }
  const cid = $("a_comp").value || null;
  if(apptId){
    const a = DB.appointments.find(x=>x.id===apptId);
    a.date = date; a.time = $("a_time").value||""; a.title = title; a.note = $("a_note").value.trim(); a.companyId = cid;
  }else{
    DB.appointments.push({ id:uid(), date, time:$("a_time").value||"",
      title, note:$("a_note").value.trim(), companyId:cid });
  }
  save(); closeModal();
  calSel = date; calMonth = fromIso(date); calMonth.setDate(1);
  render(); toast(apptId?"Avtale oppdatert":"Avtale lagret");
}
function delAppt(id){
  if(!confirm("Slette avtalen?")) return;
  DB.appointments = DB.appointments.filter(a=>a.id!==id);
  save(); closeModal(); render(); toast("Avtale slettet");
}

function renderMemoList(){
  const q = searchQ.trim().toLowerCase();
  const searching = !!q;
  let list = DB.memos.filter(m => !q || m.title.toLowerCase().includes(q) || (m.body||"").toLowerCase().includes(q));
  if(!DB.memos.length){
    $("memolist").innerHTML = '<div class="empty">Ingen notater enda.<br>Bruk knappen under for å lage det første.</div>';
    return;
  }
  if(!list.length){ $("memolist").innerHTML = '<div class="empty">Ingen treff.</div>'; return; }
  const grip = '<div class="grip" onpointerdown="memoDragStart(event)" aria-label="Dra for å endre rekkefølge"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></div>';
  $("memolist").innerHTML = list.map(m =>
    '<div class="card memocard" data-id="'+m.id+'">'+
      (searching ? "" : grip)+
      '<div class="memobody" onclick="openMemoForm(\''+m.id+'\')">'+
        '<div class="cname">'+esc(m.title)+'</div>'+
        (m.body ? '<div class="caddr" style="white-space:pre-wrap; margin-top:6px">'+esc(m.body)+'</div>' : "")+
      '</div>'+
    '</div>').join("");
}
/* ---- dra-rekkefølge ---- */
let _dragEl = null;
function memoDragStart(e){
  e.preventDefault();
  _dragEl = e.currentTarget.closest(".card");
  _dragEl.classList.add("dragging");
  e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
  document.addEventListener("pointermove", memoDragMove);
  document.addEventListener("pointerup", memoDragEnd, { once:true });
}
function memoDragMove(e){
  if(!_dragEl) return;
  const list = $("memolist");
  const cards = [...list.querySelectorAll(".card")].filter(c => c !== _dragEl);
  let placed = false;
  for(const c of cards){
    const r = c.getBoundingClientRect();
    if(e.clientY < r.top + r.height/2){ list.insertBefore(_dragEl, c); placed = true; break; }
  }
  if(!placed) list.appendChild(_dragEl);
}
function memoDragEnd(){
  document.removeEventListener("pointermove", memoDragMove);
  if(!_dragEl) return;
  _dragEl.classList.remove("dragging");
  const ids = [...$("memolist").querySelectorAll(".card")].map(c => c.dataset.id);
  DB.memos.sort((a,b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  save();
  _dragEl = null;
}

function saveMemo(id){

  if(id){
    const m = DB.memos.find(x=>x.id===id); m.title=title; m.body=body; m.updated=Date.now();
  }else{
    DB.memos.push({ id:uid(), title, body, updated:Date.now() });
  }
  save(); closeModal(); render(); toast("Lagret");

function delMemo(id){
  const m = DB.memos.find(x=>x.id===id);
  if(!confirm('Slette notatet "'+m.title+'"? Dette kan ikke angres.')) return;
  DB.memos = DB.memos.filter(x=>x.id!==id);
  save(); closeModal(); go("notes"); toast("Notat slettet");
}

/* ================= backup ================= */
function cloudSection(){
  const configured = !!localStorage.getItem("fb_config");
  let h = '<h2>Sky / synk</h2>';
  if(!configured){
    h += '<div class="notebox" style="color:var(--muted)">Ikke satt opp enda. Lim inn Firebase-konfigurasjonen for å aktivere sky-synk mellom enheter.</div>'+
    '<button class="btn2" onclick="openCloudSetup()">Sett opp Firebase</button>';
    return h;
  }
  if(!window.fbReady){
    h += '<div class="notebox" style="color:var(--muted)">Firebase er satt opp, men koblingen er ikke klar. Sjekk at du har nett, og prøv å laste appen på nytt.</div>'+
    '<button class="btn2" onclick="openCloudSetup()">Endre Firebase-oppsett</button>';
    return h;
  }
  if(CLOUD && cloudUser){
    h += '<div class="box"><div class="row"><span class="rlabel">Innlogget</span><span class="rval">'+esc(cloudUser.email||cloudUser.name||"")+'</span></div>'+
    '<div class="row"><span class="rlabel">Synk</span><span class="rval" style="color:var(--green)">Aktiv</span></div></div>'+
    '<button class="btn2" onclick="window.fbPushLocal && window.fbPushLocal()">Last lokale data opp til skyen</button>'+
    '<button class="btn-danger" onclick="window.fbSignOut && window.fbSignOut()">Logg ut</button>';
  } else {
    h += '<div class="notebox" style="color:var(--muted)">Logg inn med Google for å synke data til skyen og mellom enheter.</div>'+
    '<button class="btn" onclick="window.fbSignIn && window.fbSignIn()">Logg inn med Google</button>'+
    '<button class="btn2" onclick="openCloudSetup()">Endre Firebase-oppsett</button>';
  }
  return h;
}
function openCloudSetup(){
  history.pushState({modal:1, v:view, d:detailId}, "");
  const cur = localStorage.getItem("fb_config") || "";
  $("modal").innerHTML =
  '<div class="overlay" onclick="if(event.target===this) closeModal()"><div class="sheet">'+
  '<h3>Firebase-oppsett</h3>'+
  '<div class="notebox" style="color:var(--muted); margin-bottom:8px">Lim inn config-objektet fra Firebase-konsollen (Project settings → din web-app). Det ser ut som { apiKey: "…", authDomain: "…", projectId: "…", … }.</div>'+
  '<textarea id="fb_cfg" class="mono" style="min-height:170px" placeholder=\'{ "apiKey": "...", "authDomain": "...", "projectId": "...", "appId": "..." }\'>'+esc(cur)+'</textarea>'+
  '<button class="btn" onclick="saveCloudConfig()">Lagre og last på nytt</button>'+
  '<button class="btn2" onclick="closeModal()">Avbryt</button>'+
  '</div></div>';
}
function saveCloudConfig(){
  let raw = $("fb_cfg").value.trim();
  if(!raw){ toast("Lim inn config først"); return; }
  // tillat at de limer inn "const firebaseConfig = {...};" – plukk ut {...}
  const m = raw.match(/\{[\s\S]*\}/);
  if(!m){ toast("Fant ikke gyldig config"); return; }
  let obj;
  try{
    // tolerer JS-objekt med ufullstendige anførselstegn ved å bruke Function
    obj = (new Function("return ("+m[0]+")"))();
    if(!obj.apiKey || !obj.projectId) throw 0;
  }catch(e){ toast("Ugyldig config"); return; }
  localStorage.setItem("fb_config", JSON.stringify(obj));
  toast("Lagret – laster på nytt");
  setTimeout(()=>location.reload(), 700);
}

function renderBackup(){
  const nServices = DB.companies.reduce((n,c)=>n+(c.history?c.history.length:0),0);
  $("app").innerHTML =
  '<h1>Backup</h1>'+
  '<h2>Status</h2>'+
  '<div class="box">'+
  '<div class="row"><span class="rlabel">Bedrifter</span><span class="rval">'+DB.companies.length+'</span></div>'+
  '<div class="row"><span class="rlabel">Registrerte besøk</span><span class="rval">'+nServices+'</span></div>'+
  '<div class="row"><span class="rlabel">Avtaler</span><span class="rval">'+DB.appointments.length+'</span></div>'+
  '<div class="row"><span class="rlabel">Notater</span><span class="rval">'+DB.memos.length+'</span></div>'+
  '<div class="row"><span class="rlabel">Siste fil-backup</span><span class="rval">'+(DB.lastExport?fmt(DB.lastExport.slice(0,10)):"Aldri")+'</span></div>'+
  '</div>'+
  '<h2>Fil-backup</h2>'+
  '<button class="btn" onclick="exportData()">Last ned backup (fil)</button>'+
  '<button class="btn2" onclick="$(\'importfile\').click()">Importer backup</button>'+
  '<input id="importfile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)">'+
  '<div class="notebox" style="color:var(--muted); margin-top:12px">Uten sky-synk lagres alt lokalt på denne telefonen. '+
  'Ta fil-backup jevnlig og legg fila i Google Drive. Ved telefonbytte: importer fila på ny telefon.</div>'+
  cloudSection();
}
function exportData(){
  DB.lastExport = iso(today0());
  save();
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "anleggsservice-backup-" + iso(today0()) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
  render(); toast("Backup lastet ned");
}
function importData(input){
  const file = input.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.companies)) throw 0;
      if(!confirm("Importere "+d.companies.length+" bedrifter? Dette ERSTATTER alt som ligger i appen nå.")) return;
      DB = { companies:d.companies, appointments:d.appointments||[], memos:d.memos||[], lastExport:d.lastExport||null };
      save(); render(); toast("Backup importert");
    }catch(e){ toast("Ugyldig backupfil"); }
  };
  r.readAsText(file);
  input.value = "";
}

/* ================= init ================= */
$("ver").textContent = APP_VERSION;
(function(){
  const sp = $("splash"); if(!sp) return;
  sp.querySelector("img").src = LOGO_SRC;
  setTimeout(()=>{ sp.classList.add("hide");
    setTimeout(()=>{ if(sp.parentNode) sp.parentNode.removeChild(sp); }, 450);
  }, SPLASH_MS);
})();
setInterval(tickClock, 200);
history.replaceState({v:"dash", d:null}, "");
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>

<script type="module">
/* ===== Firebase-bro: kjører kun hvis bruker har lagt inn config ===== */
const cfgRaw = localStorage.getItem("fb_config");
if(cfgRaw){
  try{
    const cfg = JSON.parse(cfgRaw);
    const [{ initializeApp }, auth, fs] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
    ]);
    const app = initializeApp(cfg);
    const fbAuth = auth.getAuth(app);
    const db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    const provider = new auth.GoogleAuthProvider();
    window.fbReady = true;

    let userDocRef = null;
    let unsub = null;

    window.fbSignIn = () => auth.signInWithRedirect(fbAuth, provider);
    window.fbSignOut = async () => {
      if(unsub){ unsub(); unsub = null; }
      await auth.signOut(fbAuth);
    };
    window.fbSave = (data) => {
      if(userDocRef) fs.setDoc(userDocRef, { data, updated: Date.now() });
    };
    window.fbPushLocal = () => {
      if(!userDocRef) return;
      if(!confirm("Laste opp dataene på denne enheten til skyen? Dette overskriver det som ligger i skyen nå.")) return;
      try{ const local = JSON.parse(localStorage.getItem("anleggsservice_v1")); fs.setDoc(userDocRef, { data: local, updated: Date.now() }); }catch(e){}
    };

    // håndter resultat av redirect-innlogging (svelger feil stille)
    auth.getRedirectResult(fbAuth).catch(()=>{});

    auth.onAuthStateChanged(fbAuth, (user) => {
      if(user){
        window.onAuthChange && window.onAuthChange({ name:user.displayName, email:user.email });
        userDocRef = fs.doc(db, "users", user.uid);
        if(unsub) unsub();
        unsub = fs.onSnapshot(userDocRef, (snap) => {
          window.onCloudData && window.onCloudData(snap.exists() ? snap.data().data : null);
        }, (err)=>{ console.warn("snapshot-feil", err); });
      } else {
        window.onAuthChange && window.onAuthChange(null);
        if(unsub){ unsub(); unsub = null; }
        userDocRef = null;
      }
    });
  }catch(e){
    console.warn("Firebase-init feilet", e);
    window.fbReady = false;
  }
}
</script>
